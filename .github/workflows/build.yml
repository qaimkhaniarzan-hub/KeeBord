name: Build Firmware

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi

      - name: Install rmk-cli
        run: cargo install rmk-cli

      - name: Build Firmware
        run: |
          cd firmware
          rmk-cli build

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: rp2040-firmware
          path: firmware/**/*.uf2
