name: Build Firmware

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        uses: HaoboGu/rmk-action@v0.1.0
        with:
          keyboard-toml: firmware/keyboard.toml

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: rp2040-firmware
          path: build/rp2040/*.uf2
